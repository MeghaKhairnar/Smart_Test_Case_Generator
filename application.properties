# Configuration file for AI Test Case Generator
# Set environment variables or modify values here

# LLM Configuration
# Provider: "openai" or "claude"
LLM_PROVIDER=openai

# OpenAI API Key
# Get from: https://platform.openai.com/api-keys
LLM_API_KEY=sk-your-api-key-here

# Model selection
# OpenAI: gpt-4, gpt-4-turbo-preview, gpt-3.5-turbo
# Claude: claude-3-opus-20240229, claude-3-sonnet-20240229
LLM_MODEL=gpt-4

# JIRA Configuration (Optional)
# Leave blank if not using JIRA integration
JIRA_URL=https://your-jira-instance.atlassian.net
JIRA_USERNAME=your-email@example.com
JIRA_API_TOKEN=your-jira-api-token

# JIRA Project Key where test cases will be created
JIRA_PROJECT_KEY=TEST

# XRay Configuration (Optional)
# Leave blank if not using XRay integration
XRAY_API_TOKEN=your-xray-api-token

# Test Generation Settings
TEST_CASES_PER_STORY=5
INCLUDE_POSITIVE_TESTS=true
INCLUDE_NEGATIVE_TESTS=true
INCLUDE_EDGE_CASES=true

# Output Settings
OUTPUT_DIRECTORY=generated-tests
TEST_CLASS_PACKAGE=com.example.tests
